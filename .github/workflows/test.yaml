name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable, nightly]
    name: Test (Neovim ${{ matrix.nvim }})
    steps:
      - uses: actions/checkout@v4

      - uses: nvim-neorocks/nvim-busted-action@v1
        with:
          nvim_version: ${{ matrix.nvim }}
          before: |
            git clone --depth 1 https://github.com/tree-sitter-grammars/tree-sitter-yaml /tmp/ts-yaml
            cd /tmp/ts-yaml && cc -shared -fPIC -o yaml.so -I./src src/parser.c src/scanner.c
            mkdir -p ~/.local/share/nvim/site/parser
            cp yaml.so ~/.local/share/nvim/site/parser/
