name: luarocks

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    uses: ./.github/workflows/quality.yaml

  publish:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nvim-neorocks/luarocks-tag-release@v7
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          license: GPL-3.0
