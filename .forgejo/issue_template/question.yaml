name: Question
description: Ask a question about using forge.nvim
title: 'question: '
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for usage questions or general discussion about forge.nvim.
        For bug reports, please use the bug report form instead.
        For feature ideas, please use the feature request form instead.

  - type: textarea
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    attributes:
      label: Context
      description: Relevant details such as `:checkhealth forge` output or screenshots
